[tool.poetry]
name = "cervixscan"
version = "0.1.0"
description = "Development of mobile and web applications that utilize a built deep learning based algorithm to accurately identify a woman's cervix type based on images."
authors = ["Samuel Ozechi <samuelozechi@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.3"
flask-cors = "^6.0.2"
numpy = "^2.4.4"
opencv-python-headless = "^4.13.0"
tensorflow-cpu = "^2.17.0"
gunicorn = "^23.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"